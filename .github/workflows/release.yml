name: release

# Tag push -> build the ISO, prove it boots, publish a GitHub Release
# with the image attached.
#
#   git tag v0.0.3 && git push origin v0.0.3

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO
        run: |
          iso/build.sh
          # The ISO is built inside a container as root, so dist/ comes back
          # root-owned; the steps below rename and checksum it as the runner.
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Smoke-boot in QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
          # A release must boot: success = the compositor announces itself
          # and the live medium is found, same gate as the iso workflow —
          # including the virtio-net adapter, so a release is booted on a
          # machine shaped like the one iso.yml proved, not a quieter one.
          timeout 120 qemu-system-x86_64 \
            -m 1024 -cdrom dist/tos-x86_64.iso \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -vga std -display none -serial file:serial.log &
          qemu_pid=$!
          for _ in $(seq 60); do
            grep -q "tOS: starting compositor" serial.log 2>/dev/null && break
            sleep 2
          done
          kill "$qemu_pid" 2>/dev/null || true
          echo "--- serial log ---"
          cat serial.log || true
          grep -q "tOS: starting compositor" serial.log
          grep -q "tOS: live medium is" serial.log
          # And that it got into the Debian rootfs. Both lines above are
          # printed by the initramfs fallback too, so without this a release
          # whose squashfs never mounts ships green — with an image that has
          # no apt on it, which is the whole of what the rootfs is for.
          grep -q "tOS: booting the Debian rootfs" serial.log
      - name: Stamp the version into the artifacts
        run: |
          mv dist/tos-x86_64.iso "dist/tos-${GITHUB_REF_NAME}-x86_64.iso"
          (cd dist && sha256sum ./*.iso > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag that moves is a release being rebuilt: the image had a bug
          # worth fixing before anyone else downloads it. Replace what the
          # release carries instead of failing on the one already there, and
          # keep its notes, which someone may have edited by hand.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/*.iso dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "tOS $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.iso dist/SHA256SUMS
          fi
