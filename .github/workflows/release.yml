name: release

# Tag push -> build the ISO, prove it boots, publish a GitHub Release
# with the image attached, then build the Android APK and attach that too.
#
#   git tag v0.0.3 && git push origin v0.0.3
#
# The APK needs a signing identity that outlives the runner. Set these
# repository secrets, from the keystore the previous releases were signed
# with, or every release installs as a different app:
#
#   TOS_ANDROID_KEYSTORE_BASE64   base64 of dist/android/development.keystore
#   TOS_ANDROID_STORE_PASSWORD    its password
#   TOS_ANDROID_KEY_ALIAS         optional; defaults to tos-development

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO
        run: |
          iso/build.sh
          # The ISO is built inside a container as root, so dist/ comes back
          # root-owned; the steps below rename and checksum it as the runner.
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Smoke-boot in QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
          # A release must boot: success = the compositor announces itself
          # and the live medium is found, same gate as the iso workflow —
          # including the virtio-net adapter, so a release is booted on a
          # machine shaped like the one iso.yml proved, not a quieter one.
          timeout 120 qemu-system-x86_64 \
            -m 1024 -cdrom dist/tos-x86_64.iso \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -vga std -display none -serial file:serial.log &
          qemu_pid=$!
          for _ in $(seq 60); do
            grep -q "tOS: starting compositor" serial.log 2>/dev/null && break
            sleep 2
          done
          kill "$qemu_pid" 2>/dev/null || true
          echo "--- serial log ---"
          cat serial.log || true
          grep -q "tOS: starting compositor" serial.log
          grep -q "tOS: live medium is" serial.log
          # And that it got into the Debian rootfs. Both lines above are
          # printed by the initramfs fallback too, so without this a release
          # whose squashfs never mounts ships green — with an image that has
          # no apt on it, which is the whole of what the rootfs is for.
          grep -q "tOS: booting the Debian rootfs" serial.log
      - name: dpkg and apt are on the image being released
        # The same assertions the iso workflow makes. A release that boots is
        # not a release that can install anything: a rootfs missing apt, the
        # installer or the Japanese face prints nothing on serial and passes
        # every gate above it.
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          iso/check-rootfs.sh dist/tos-x86_64.iso
      - name: Stamp the version into the artifacts
        run: |
          mv dist/tos-x86_64.iso "dist/tos-${GITHUB_REF_NAME}-x86_64.iso"
          (cd dist && sha256sum ./*.iso > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag that moves is a release being rebuilt: the image had a bug
          # worth fixing before anyone else downloads it. Replace what the
          # release carries instead of failing on the one already there, and
          # keep its notes, which someone may have edited by hand.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/*.iso dist/SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "tOS $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*.iso dist/SHA256SUMS
          fi

  android:
    name: android apk
    # After the ISO, because this attaches to the release that job publishes.
    # A tag whose ISO did not boot has nothing to attach an APK to.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      - name: Install the Android platform and NDK the APK is built against
        # The NDK is pinned for the same reason the kernel and the Debian base
        # are: the guest's init and agent are statically linked against its
        # libc, and r27's gives them an 8-byte-aligned TLS segment that Bionic
        # refuses to exec. v0.0.8 shipped that way — the VM panicked on PID 1
        # and no phone that installed it ever reached Debian. The runner
        # exports its own ANDROID_NDK_HOME, so pointing the build at this one
        # means overriding that rather than installing beside it.
        env:
          NDK: "29.0.14206865"
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-35" "ndk;$NDK" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"
      - name: Take the signing identity out of the secrets
        env:
          KEYSTORE: ${{ secrets.TOS_ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.TOS_ANDROID_STORE_PASSWORD }}
        run: |
          # An APK signed with a key nobody has seen before cannot update the
          # tOS already on somebody's phone: Android refuses the install, and
          # the uninstall that would make room for it takes the guest Debian
          # disk with it. So a release without the identity stops here rather
          # than publishing one that costs its users their data.
          if [[ -z $KEYSTORE || -z $PASSWORD ]]; then
            echo 'Set TOS_ANDROID_KEYSTORE_BASE64 and TOS_ANDROID_STORE_PASSWORD to the identity previous releases were signed with.' >&2
            exit 1
          fi
          mkdir -p dist/android
          printf '%s' "$KEYSTORE" | base64 -d > dist/android/release.keystore
      - name: Build the Debian disk the APK carries
        run: |
          bash android/vm/build-image.sh
          # The rootfs is assembled inside a container as root, the same way
          # the ISO is, so dist/ comes back with root-owned files in it.
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Build the APK
        env:
          TOS_ANDROID_KEYSTORE: ${{ github.workspace }}/dist/android/release.keystore
          TOS_ANDROID_KEY_ALIAS: ${{ secrets.TOS_ANDROID_KEY_ALIAS }}
          TOS_ANDROID_STORE_PASSWORD: ${{ secrets.TOS_ANDROID_STORE_PASSWORD }}
        run: bash android/build-apk.sh
      - name: Stamp the version into the APK
        run: |
          cd dist/android
          rm -f tos-android-arm64.apk.idsig tos-android-arm64.apk.sha256
          mv tos-android-arm64.apk "tos-${GITHUB_REF_NAME}-android-arm64.apk"
          sha256sum "tos-${GITHUB_REF_NAME}-android-arm64.apk" > SHA256SUMS-android
          cat SHA256SUMS-android
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME" --clobber
          "dist/android/tos-${GITHUB_REF_NAME}-android-arm64.apk"
          dist/android/SHA256SUMS-android
      - name: Forget the signing identity
        if: always()
        run: rm -f dist/android/release.keystore
