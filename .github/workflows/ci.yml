name: ci

# The ISO workflow proves the image boots. This one proves the code is
# correct, which is a different question and needs to run on every change,
# not only on the ones that touch the image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody sees becomes a warning that nobody fixes.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        # The PTY and installer tests fork real processes; they need a
        # terminal-shaped environment but no display.
        run: cargo test --workspace -- --nocapture --test-threads 4
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  cross:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # The compositor's kernel-facing backends only exist on Linux, and
          # tOS targets both PCs and arm64 boards, so both have to keep
          # compiling even though only one of them is tested.
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          # The ISO links a fully static binary; musl is what that means.
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          # The container and initramfs scripts are POSIX shell; build.sh and
          # run.sh run on the host and are bash.
          for script in iso/mkiso.sh iso/init iso/profile; do
            sh -n "$script" || exit 1
          done
          for script in iso/build.sh iso/run.sh; do
            bash -n "$script" || exit 1
          done
      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          # Each script's own shebang says which shell it is, except the
          # profile, which is sourced and so has none.
          shellcheck --severity=warning iso/build.sh iso/run.sh iso/mkiso.sh iso/init
          shellcheck --shell=sh --severity=warning iso/profile
