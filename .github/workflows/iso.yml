name: iso

on:
  push:
    branches: [main]
    paths:
      - "compositor/**"
      - "installer/**"
      - "iso/**"
      - ".motd_art"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/iso.yml"
  pull_request:
    paths:
      - "compositor/**"
      - "installer/**"
      - "iso/**"
      - ".motd_art"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/iso.yml"
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO
        run: iso/build.sh
      - name: Smoke-boot in QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
          # Headless boot: success = the compositor announces itself on serial
          # within the timeout. GRUB's serial console is not configured, so we
          # wait through its menu timeout blindly.
          #
          # The virtio-net adapter matches the virtio_net the initramfs packs,
          # so this boot has a link to find; user-mode networking needs no
          # privilege on the runner and hands out 10.0.2.x the same way the
          # VirtualBox NAT in iso/run.sh does. Nothing below greps for it yet —
          # the interface arriving is not something /init says on serial — but
          # a machine with no adapter could never have one.
          timeout 120 qemu-system-x86_64 \
            -m 1024 -cdrom dist/tos-x86_64.iso \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -vga std -display none -serial file:serial.log &
          qemu_pid=$!
          for _ in $(seq 60); do
            grep -q "tOS: starting compositor" serial.log 2>/dev/null && break
            sleep 2
          done
          kill "$qemu_pid" 2>/dev/null || true
          echo "--- serial log ---"
          cat serial.log || true
          grep -q "tOS: starting compositor" serial.log
          # The installer is what makes the ISO worth booting twice; if the
          # medium was not found it cannot copy a kernel onto a disk.
          grep -q "tOS: live medium is" serial.log
      - name: The live session reached the Debian rootfs
        # A machine that cannot mount the squashfs falls back to the initramfs
        # session and still says "starting compositor", so the smoke boot above
        # would stay green while every installed disk quietly went back to
        # being busybox. This is the line that says which root it got.
        run: |
          grep -q "tOS: booting the Debian rootfs" serial.log
      - name: dpkg and apt are on the installed disk
        # #83: a tOS machine had no package manager at all, and nothing could
        # ever be added to one. The installer's CopySystem step is an
        # `unsquashfs` of this exact file onto the new root — the test in
        # installer/src/install.rs is what pins that — so what is inside it is
        # what an installed machine has.
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          sudo mkdir -p /mnt/tos-iso
          sudo mount -o loop,ro dist/tos-x86_64.iso /mnt/tos-iso
          unsquashfs -l /mnt/tos-iso/live/filesystem.squashfs > rootfs.list
          sudo umount /mnt/tos-iso
          # Debian is usr-merged, so /usr/bin is where /bin/apt really lives.
          # tos-session is what /init execs after the pivot and init is what
          # an installed machine's inittab is read by; without either, the
          # disk boots to nothing.
          for path in usr/bin/dpkg usr/bin/apt usr/bin/bash usr/bin/mount \
              usr/sbin/init usr/sbin/tos usr/sbin/tos-install \
              usr/sbin/tos-session var/lib/dpkg/status; do
            grep -qx "squashfs-root/$path" rootfs.list || {
              echo "the rootfs has no /$path"; exit 1; }
          done
          # The Japanese face, which nothing else here would miss: the
          # compositor falls back to its built-in bitmap and every kana turns
          # into a hollow box, with the boot and every assertion above still
          # green. It moved out of the initramfs and into the rootfs, so this
          # is the only place left that can say it is on the image.
          grep -q "^squashfs-root/usr/share/fonts/truetype/vlgothic/" rootfs.list || {
            echo "the rootfs carries no Japanese face"; exit 1; }
          echo "rootfs entries: $(wc -l < rootfs.list)"
      - uses: actions/upload-artifact@v4
        with:
          name: tos-iso-x86_64
          path: dist/*.iso
