[package]
name = "tos-font"
description = "tOS glyph engine: bitmap fallback font, procedural box drawing, TTF rasterization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ttf"]
ttf = ["dep:fontdue", "dep:ttf-parser"]

[dependencies]
fontdue = { version = "0.9", optional = true, default-features = false, features = ["std"] }
# fontdue disables this upstream feature; Android Noto CJK needs CFF2 outlines.
ttf-parser = { version = "0.25", optional = true, default-features = false, features = ["variable-fonts"] }
