#? Config file for btop, written by iso/mkiso.sh. See docs/design/applications.md.

# btop draws its graphs out of braille (U+2800-U+28FF) by default, and no face
# tOS can ship has them: not HackGen Console NF, not the VL Gothic it replaced,
# and not DejaVu Sans Mono either — checked against all three by rendering
# U+28FF in a pane, where every one of them came out as the missing-glyph box.
# Every gauge and every history graph in btop is then a field of little empty
# rectangles, which is most of btop's screen.
#
# Block elements are in all three faces and in tOS's own built-in bitmap face,
# so this is the setting that makes the program look like itself. It costs
# vertical resolution — a block cell is 1 of 8 levels where braille is 1 of 4
# per column — and that is a price worth paying for a graph that is drawn at
# all.
graph_symbol = "block"
